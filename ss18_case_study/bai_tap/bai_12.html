<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bai 12</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
<form action="">
    <input type="button" value="Thêm mới học viên" onclick="themHocVien()">
    <input type="button" value="Sửa thông tin học viên" onclick="suaHocVien()">
    <input type="button" value="Xóa học viên" onclick="xoaHocVien()"> <br><br>

    <table style="width:100%" id="tableHocVien">
        <tr>
            <th>Mã học viên</th>
            <th>Tên</th>
            <th>Lớp</th>
            <th>Email</th>
            <th>Ngày sinh</th>
            <th>Module</th>
        </tr>
    </table>

</form>
</body>
<script>
    // =====================
    // 1. Lớp Học Viên
    // =====================
    function HocVien(maHocVien = "", ten = "", lop = "", email = "", ngaySinh = "", module = "") {
        this.maHocVien = maHocVien;
        this.ten = ten;
        this.lop = lop;
        this.email = email;
        this.ngaySinh = ngaySinh;
        this.module = module;
    }

    // =====================
    // 2. Lớp Quản Lý Học Viên
    // =====================
    function LopHocVien() {
        this.allHocVien = [];

        this.themHocVien = function (hocVien) {
            this.allHocVien.push(hocVien);
        }

        this.timHocVien = function (maHocVien) {
            return this.allHocVien.find(hv => hv.maHocVien === maHocVien);
        }

        this.xoaHocVien = function (maHocVien) {
            let index = this.allHocVien.findIndex(hv => hv.maHocVien === maHocVien);
            if (index !== -1) {
                this.allHocVien.splice(index, 1);
                return true;
            }
            return false;
        }
    }

    let lopHV = new LopHocVien();

    // =====================
    // 3. DỮ LIỆU DEMO
    // =====================
    lopHV.themHocVien(new HocVien("HV01", "Nguyen Van A", "C0923", "a@gmail.com", "2001-05-12", "JS"));
    lopHV.themHocVien(new HocVien("HV02", "Tran Thi B", "C0923", "b@gmail.com", "2002-08-21", "Java"));
    lopHV.themHocVien(new HocVien("HV03", "Le Van C", "C1023", "c@gmail.com", "2000-12-01", "Python"));

    // =====================
    // 4. HIỂN THỊ BẢNG
    // =====================
    function hienThi() {
        let table = document.getElementById("tableHocVien");
        table.innerHTML = `
            <tr>
                <th>Mã học viên</th>
                <th>Tên</th>
                <th>Lớp</th>
                <th>Email</th>
                <th>Ngày sinh</th>
                <th>Module</th>
            </tr>
        `;

        for (let hv of lopHV.allHocVien) {
            table.innerHTML += `
                <tr>
                    <td>${hv.maHocVien}</td>
                    <td>${hv.ten}</td>
                    <td>${hv.lop}</td>
                    <td>${hv.email}</td>
                    <td>${hv.ngaySinh}</td>
                    <td>${hv.module}</td>
                </tr>
            `;
        }
    }

    hienThi();

    // =====================
    // 5. THÊM HỌC VIÊN
    // =====================
    function themHocVien() {
        let ma = prompt("Nhập mã học viên:");
        if (lopHV.timHocVien(ma)) {
            alert("Mã học viên đã tồn tại!");
            return;
        }

        let ten = prompt("Nhập tên:");
        let lop = prompt("Nhập lớp:");
        let email = prompt("Nhập email:");
        let ngaySinh = prompt("Nhập ngày sinh:");
        let module = prompt("Nhập module:");

        lopHV.themHocVien(new HocVien(ma, ten, lop, email, ngaySinh, module));
        hienThi();
    }

    // =====================
    // 6. SỬA HỌC VIÊN
    // =====================
    function suaHocVien() {
        let ma = prompt("Nhập mã học viên cần sửa:");
        let hv = lopHV.timHocVien(ma);

        if (!hv) {
            alert("Mã học viên không tồn tại");
            return;
        }

        hv.ten = prompt("Tên mới:", hv.ten);
        hv.lop = prompt("Lớp mới:", hv.lop);
        hv.email = prompt("Email mới:", hv.email);
        hv.ngaySinh = prompt("Ngày sinh mới:", hv.ngaySinh);
        hv.module = prompt("Module mới:", hv.module);

        hienThi();
    }

    // =====================
    // 7. XÓA HỌC VIÊN
    // =====================
    function xoaHocVien() {
        let ma = prompt("Nhập mã học viên cần xóa:");
        let hv = lopHV.timHocVien(ma);

        if (!hv) {
            alert("Mã học viên không tồn tại");
            return;
        }

        if (confirm("Bạn có chắc chắn muốn xóa?")) {
            lopHV.xoaHocVien(ma);
            hienThi();
        }
    }
</script>

</html>
