</body>
<script>
    let arr = prompt("Nhập mảng các phần tử, cách nhau bởi dấu cách:").trim().split(/\s+/).map(function(item) {
        return Number(item);
    });
    function ktSoNguyenTo(n) {
        if (n < 2) return false;
        for (let i = 2; i <= Math.sqrt(n); i++) {
            if (n % i === 0) return false;
        }
        return true;
    }

    function check(arr) {
        for (let x of arr) {
            if (!Number.isNaN(x) && !ktSoNguyenTo(x)) {
                return false;
            }
        }
        return true;
    }

    alert(check(arr));
</script>
</html>
