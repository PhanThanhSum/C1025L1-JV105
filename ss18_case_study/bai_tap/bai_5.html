<script>
    let n = prompt("Nhap vao 1 so")
    function findMaxNumber(n) {
        if (n.length === 4) {
            let i = 0
            while (n[i] > n[i + 1] && i < n.length - 1) {
                i++;
            }
            return Number(n.slice(0, i) + n.slice(i + 1))
        } else {
            return -1
        }
    }
    alert(findMaxNumber(n))
</script>
