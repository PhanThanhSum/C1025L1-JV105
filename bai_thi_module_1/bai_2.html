<script>
    let num = Number(prompt("Nhap vao 1 so tu nhien"));
    alert(laSoHoanHao(num));



    function laSoHoanHao(n) {
        if (n <= 1) return false;

        let sum = 0;

        for (let i = 1; i <= n / 2; i++) {
            if (n % i === 0) {
                sum += i;
            }
        }

        return sum === n;
    }
</script>
