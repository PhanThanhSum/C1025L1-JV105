<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form action="">
    <h1>ĐĂNG KÝ HỌC VIÊN</h1>
    <label for="name">Họ và tên</label>
    <input type="text" id="name" name="name"> <br>
    <label for="dob">Ngày sinh</label>
    <input type="text" id="dob" name="dob"> <br>
    <label>Giới tính</label>
    <input type="radio" name="gender" id="male"> Nam
    <input type="radio" name="gender" id="female"> Nữ <br>
    <label>Địa chỉ</label>
    <textarea name="add" id="" cols="30" rows="10"></textarea> <br>
    <label>Lớp</label>
    <select name="class" id="">
        <option value="" disabled selected hidden>-- Chọn lớp --</option>
        <option value="10">Lớp 10</option>
        <option value="11">Lớp 11</option>
        <option value="12">Lớp 12</option>
    </select> <br>
    <label for="email">Email</label>
    <input type="text" name="email" id ="email"> <br>
    <label for="phone">Số điện thoại</label>
    <input type="text" name="phone" id ="phone"> <br>
    <input type="submit" value="Đăng ký">
    <input type="reset" value="Nhập lại">

</form>
</body>
</html>
