<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra năm nhuận</title>
</head>
<body>

</body>
<script>
    let nam = Number(prompt("Nhap vao nam: "));
    if (nam % 4 === 0 && nam % 100 !== 0) {
        alert("Nam " + nam + " la nam nhuan")
    } else if (nam % 100 === 0 && nam % 400 === 0) {
        alert("Nam " + nam + " la nam nhuan")
    } else {
        alert("Nam " + nam + " khong phai la nam nhuan")
    }
</script>
</html>
