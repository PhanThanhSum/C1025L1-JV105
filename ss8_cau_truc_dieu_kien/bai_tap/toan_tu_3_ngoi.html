<script>
    bai1()
    bai2()
    function bai1 () {
        let a = Number(prompt("Nhap vao a", 0))
        let b = Number(prompt("Nhap vao b", 0))
        let result = (a + b) < 4 ? 'Below' : 'Over';
        alert(result);
    }

    function bai2 () {
        let message = prompt("Nhap vao message")
        let result = message === "Employee" ? "Hello" : message === "Director" ? "Greetings" : message === "" ? "No login" : ""
        alert(result);
    }

</script>
