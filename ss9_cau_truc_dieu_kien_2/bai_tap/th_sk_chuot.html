<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Su kien chuot</title>
</head>
<body>
<img src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Soccer_ball.svg" alt="Anh" id="myImage" style="height: 100px"> <br>
<p>Click button below to move the image to right</p>
<input type="button" value="Click me" onclick=moveRight()>
</body>
<script>
    var myImage = document.getElementById('myImage');
    function init() {
        myImage.style.position = 'relative';
        myImage.style.left = '0px';
    }
    function moveRight() {
        myImage.style.left = parseInt(myImage.style.left) + 10 + 'px';
    }
    window.onload = init;
</script>
</html>
