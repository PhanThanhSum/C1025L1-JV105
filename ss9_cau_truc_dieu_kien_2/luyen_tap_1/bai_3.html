<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bai 3</title>
</head>
<body>
<p id="result"></p>
</body>
<script>
    let a = prompt("Nhap vao 1 so nguyen");
    if(a > 0) {
        document.getElementById("result").innerHTML = "Lon hon 0";
    } else if (a < 0) {
        document.getElementById("result").innerHTML = "Nho hon 0";
    } else {
        document.getElementById("result").innerHTML = "Bang 0";
    }
</script>
